# Users and groups for the local kind demo (app-config.kind.yaml). In production the GitHub organisation provider imports the
# real members and teams instead (app-config.github.yaml): a GitHub team with the slug `maintainers` becomes this group, and
# every member becomes a User named after their GitHub login - which is also how the sign-in resolver finds them.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-boutique
  title: platform-boutique
  description: The organisation.
spec:
  type: organization
  children: [maintainers]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: maintainers
  title: Maintainers
  description: Owns everything in the platform. Members can change the repositories; the portal itself is read-only.
spec:
  type: team
  parent: platform-boutique
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: mladenovskistefan111
  title: Stefan Mladenovski
spec:
  profile:
    displayName: Stefan Mladenovski
  memberOf: [maintainers]
---
# Stand-in identity used to test single sign-on locally without GitHub (Dex "local" connector, see the dex chart in
# platform-demo-helm). Not part of the production catalog.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: demo
  title: Demo user
spec:
  profile:
    displayName: Demo user
    email: demo@platform-demo.click
  memberOf: [maintainers]
