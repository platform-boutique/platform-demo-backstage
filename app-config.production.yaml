# Loaded in the container image on top of app-config.yaml. Everything environment-specific arrives as environment variables
# (the Helm chart in platform-demo-helm/backstage sets them from ConfigMap/Secret).

app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${APP_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL}
  # Single origin: the backend serves the compiled frontend (app-backend plugin), so there is no CORS in practice.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  session:
    # Express session used by the OAuth handshake only.
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # Single sign-on through Dex (OpenID Connect). Dex itself signs people in with their GitHub account and passes the
    # organisation's teams on in the `groups` claim.
    oidc:
      production:
        metadataUrl: ${DEX_ISSUER_URL:-https://dex.platform-demo.click}/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${BACKSTAGE_OIDC_CLIENT_SECRET}
        # openid, profile and email are always requested; `groups` is what Dex needs to hand out team membership and
        # `offline_access` gets a refresh token, so a browser reload does not mean signing in again.
        additionalScopes: [groups, offline_access]
        prompt: auto
        # No `signIn.resolvers` here on purpose: the resolver is code (packages/backend/src/modules/dexSignIn.ts). It looks the
        # person up in the catalog by GitHub login first, by email second, and refuses everyone else.

techdocs:
  publisher:
    local:
      # Published sites live on a volume mounted at /data (the image runs with a read-only root filesystem).
      publishDirectory: ${TECHDOCS_CACHE:-/data}/docs
