name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3

  # The Dockerfile type-checks (yarn tsc) and builds the frontend and backend; a broken app fails here. Then Trivy scans the image.
  image:
    needs: [secrets]
    permissions:
      contents: read
      packages: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-build.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3
    with:
      trivyignores: .trivyignore.yaml

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3
