name: Release

# Runs when a semver tag is pushed (git tag -a v0.1.0 && git push origin v0.1.0) or by hand.
# Gates: same as CI. Then the scanned image digest is promoted to Docker Hub and signed (keyless cosign).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the scanned image to Docker Hub and sign it (commit must be on main)
        type: boolean
        default: false

permissions: {}

jobs:
  secrets:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3

  image:
    needs: [secrets]
    permissions:
      contents: read
      packages: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-build.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3
    with:
      # The same accepted findings as CI (.trivyignore.yaml, time-boxed): without them the release gate fails on the two advisories
      # that have no fixed version anywhere, which the pull-request gate already accepted.
      trivyignores: .trivyignore.yaml

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3

  promote:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    needs: [image, workflows]
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-promote.yaml@aa79eb7ad5f2d7146190e7c61d5de715ce0e42e8 # v3.0.3
    with:
      image-name: platform-demo-backstage
      staged-image: ${{ needs.image.outputs.staged-image }}
      digest: ${{ needs.image.outputs.digest }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
