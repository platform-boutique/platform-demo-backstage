# Base configuration, always loaded. Layers on top of it (see README.md, "Configuration layers"):
#   app-config.production.yaml  PostgreSQL, Dex single sign-on, in-cluster Kubernetes, TechDocs on disk. Loaded in the image.
#   app-config.github.yaml      catalog discovery and users/teams from the GitHub organisation (needs a GitHub App or token).
#   app-config.dev.yaml         `yarn start` on a laptop (git-ignored overlay, see README.md).
#
# Every deployment-specific value is an environment variable with a default for the local platform; nothing secret is in Git.

app:
  title: platform-demo portal
  baseUrl: ${APP_BASE_URL:-http://localhost:3000}

  # Feature discovery: every package in packages/app/package.json that ships a frontend plugin is enabled.
  packages: all

  extensions:
    # The catalog is the landing page.
    - page:catalog:
        config:
          path: /

organization:
  name: platform-boutique

backend:
  baseUrl: ${APP_BASE_URL:-http://localhost:7007}
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Grafana panels are embedded in entity pages (Grafana plugin) and Hubble/Argo links open in new tabs.
    frame-src: ["'self'", '${GRAFANA_URL:-https://grafana.platform-demo.click}']
  cors:
    origin: ${APP_BASE_URL:-http://localhost:3000}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Development only; app-config.production.yaml switches to PostgreSQL.
  database:
    client: better-sqlite3
    connection: ':memory:'

integrations:
  github:
    - host: github.com
      # Used by catalog discovery when a GitHub token or app is configured (app-config.github.yaml).
      token: ${GITHUB_TOKEN}

argocd:
  # Where people click through to the Argo CD UI ("Open in Argo CD" on the Deployments tab). The portal itself talks to Argo CD's API
  # only with the signed-in person's own Dex token (see `deployments`): there is no shared token and no local Argo CD account.
  baseUrl: ${ARGOCD_URL:-https://argocd.platform-demo.click}

deployments:
  # Where the backend reaches Argo CD's API for the Deployments tab. It sends the signed-in person's Dex ID token, not a token of its own.
  argocdUrl: ${ARGOCD_API_URL:-http://argocd-server.argocd.svc.cluster.local}

grafana:
  # Where the browser reaches Grafana (links and embedded dashboards) and where the backend reaches it for the alerts list.
  domain: ${GRAFANA_URL:-https://grafana.platform-demo.click}
  unifiedAlerting: true

hubble:
  # Hubble Relay's gRPC endpoint (plaintext inside the cluster)
  relayAddress: ${HUBBLE_RELAY_ADDRESS:-hubble-relay.kube-system.svc.cluster.local:80}
  maxFlows: 200

releases:
  argocdNamespace: argocd
  # Where the desired image of an application is declared (read with Backstage's URL reader; needs the GitHub integration)
  valuesUrl: https://github.com/platform-boutique/platform-demo-helm/blob/main/envs/{env}/values/{app}.yaml
  latestTag: true

techdocs:
  # Documentation is built OUTSIDE the portal (tools/techdocs/build-docs.sh, in CI with `techdocs-cli generate`) and published
  # to the storage the portal reads from. The backend never runs MkDocs, so the image stays small and the portal needs no
  # access to the source repositories to show docs. See docs/techdocs.md.
  builder: external
  publisher:
    type: local   # a volume at /data/docs; for AWS: awsS3 (infra/ phase) - only this block changes

auth:
  # Dex is the only way in. Provider details are in app-config.production.yaml.
  environment: production
  providers: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
  # Everything the platform describes: components, APIs, systems and the resources they run on, plus groups and users.
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User]
  # Locations come from the layers (GitHub discovery or the mounted workspace).

proxy:
  endpoints:
    # Grafana API for the Grafana plugin (alerts and the dashboard list). The backend authenticates with a Grafana service account
    # token (GRAFANA_TOKEN), never with a person's session.
    '/grafana/api':
      target: ${GRAFANA_API_URL:-http://grafana.monitoring.svc.cluster.local:3000}
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

kubernetes:
  # Read-only view of the cluster the portal runs in. Objects are matched with the annotation backstage.io/kubernetes-id
  # (Kyverno copies app.kubernetes.io/name into that label on every workload pod: policies/ in platform-demo-helm).
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: ${CLUSTER_NAME:-platform-demo}
          url: ${KUBERNETES_API_URL:-https://kubernetes.default.svc}
          # No serviceAccountToken / caData on purpose: in a pod the backend reads the (rotating) projected token and the
          # CA of the pod's own ServiceAccount at request time. Its ClusterRole is read-only (platform-demo-helm, backstage chart).
          authProvider: serviceAccount
          skipTLSVerify: false
          skipMetricsLookup: true
  customResources:
    - group: argoproj.io
      apiVersion: v1alpha1
      plural: applications

permission:
  enabled: false

search:
  collators:
    catalog:
      schedule:
        frequency: { minutes: 10 }
        timeout: { minutes: 3 }
        initialDelay: { seconds: 30 }
